# The local database for development: npm run db:up (start), npm run db:fresh (wipe + sample data)
# Only this computer can reach it (127.0.0.1). The data lives in the "annapurna-pgdata" Docker volume
# and survives restarts; the real data stays on Neon and is never touched.
services:
  postgres:
    # Postgres 17 with pgvector (the help guides' embeddings, Step 6). Was postgres:17-alpine until 18 Nov 2026;
    # the data folder is the same Postgres 17 format, but after switching run `npm run db:fresh` once (Alpine and
    # Debian sort text slightly differently, which can upset existing text indexes).
    image: pgvector/pgvector:0.8.6-pg17
    container_name: annapurna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: annapurna
      POSTGRES_PASSWORD: annapurna_local
      POSTGRES_DB: annapurna
    ports:
      # 5432 unless ANNAPURNA_DB_PORT says otherwise (in .env, which Docker Compose reads by itself): on a computer
      # where another project's Postgres already uses 5432, set ANNAPURNA_DB_PORT=5433 there, and use that port in
      # .env.local's DATABASE_URL
      - "127.0.0.1:${ANNAPURNA_DB_PORT:-5432}:5432"
    volumes:
      - annapurna-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annapurna -d annapurna"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  annapurna-pgdata:
